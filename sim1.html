    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--pink);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 14px 50px;
      /* Layered leopard print frame + soft pink glow */
      background-image:
        radial-gradient(circle at top right, rgba(217, 4, 41, 0.14), transparent 45%),
        radial-gradient(circle at bottom left, rgba(0, 0, 0, 0.12), transparent 50%),
        url('download.jpeg'),
        var(--leopard-svg);
      background-size: cover, cover, 260px, 160px;
      background-attachment: fixed;
    }

    /* Main App Shell */
    .app-wrapper {
      width: 100%;
      max-width: 860px;
      background-color: var(--cream);
      border: 5px solid var(--black);
      border-radius: 28px;
      box-shadow: 0 18px 0 var(--black), 0 25px 45px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      position: relative;
    }

    /* Top Leopard & Red Banner */
    .app-header {
      background-image:
        linear-gradient(135deg, rgba(0, 0, 0, 0.72), rgba(155, 0, 28, 0.78)),
        url('download.jpeg'),
        var(--leopard-svg);
      background-size: cover, 240px, 150px;
      background-position: center;
      color: var(--cream);
      padding: 28px 26px 24px;
      border-bottom: 5px solid var(--black);
      text-align: center;
      position: relative;
    }

    .sound-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--pink);
      color: var(--black);
      border: 2.5px solid var(--black);
      border-radius: 999px;
      padding: 6px 14px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--red);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .sound-toggle:hover {
      transform: translateY(-2px);
      background: var(--cream);
    }

    .app-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.6rem, 6vw, 4rem);
      font-weight: 400;
      color: var(--pink);
      text-shadow: 3px 3px 0 var(--black), 0 0 18px rgba(217, 4, 41, 0.9);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .app-subtitle {
      font-family: 'Pacifico', cursive;
      font-size: 1rem;
      color: var(--cream);
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 0 var(--black);
    }
